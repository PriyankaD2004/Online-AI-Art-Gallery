<!DOCTYPE html>
<html>
<head>
<title>AI Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:
        linear-gradient(rgba(2,6,23,0.85), rgba(2,6,23,0.95)),
        url("/static/images/a2.jpg") no-repeat center center;
    background-size: cover;
    color:white;
}

.topbar{
    position:sticky;
    top:0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    backdrop-filter:blur(10px);
    background:rgba(0,0,0,0.5);
    border-bottom:1px solid rgba(255,255,255,0.1);
    z-index:100;
}

.topbar h2{
    background:linear-gradient(45deg,#ff7b00,#ff0066);
    -webkit-background-clip:text;
    color:transparent;
}

.nav-links a{
    margin-left:20px;
    text-decoration:none;
    color:#ccc;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    border-radius:15px;
    overflow:hidden;
    background:#111;
    position:relative;
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.badge{
    position:absolute;
    top:10px;
    left:10px;
    padding:5px 10px;
    border-radius:8px;
    font-size:12px;
    font-weight:600;
}

.ai{background:#ff0066;}
.user{background:#2ed573;}

.overlay{
    position:absolute;
    bottom:0;
    width:100%;
    padding:10px;
    background:linear-gradient(to top,rgba(0,0,0,0.8),transparent);
}

.content{
    padding:10px;
}

.btn{
    padding:8px 10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin:3px;
    text-decoration:none;
    display:inline-block;
}

.like{background:#ff4757;color:white;}
.download{background:#2ed573;color:white;}
.share{background:#3742fa;color:white;}
.delete{background:#ff3b3b;color:white;}

.comment-box{
    width:100%;
    padding:6px;
    margin-top:5px;
}
</style>
</head>

<body>

<div class="topbar">
    <h2>🎨 DSP AI Art Hub</h2>
    <div class="nav-links">
        <a href="/upload">Upload</a>
        <a href="/generate">Generate</a>
        <a href="/profile">Profile</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="gallery">

{% for img in images %}
<div class="card">

    {% if img.image_type == 'ai' %}
        <div class="badge ai">🤖 AI</div>
    {% else %}
        <div class="badge user">📷 User</div>
    {% endif %}

    <!-- IMAGE (FIXED) -->
    <img src="{{ img.image_url }}">

    <div class="overlay">
        <p>{{ img.username }}</p>
    </div>

    <div class="content">

        <p>{{ img.description }}</p>
        <p>❤️ {{ img.likes }}</p>

        <a href="/like/{{ img.id }}" class="btn like">Like</a>

        <a href="{{ img.image_url }}" download class="btn download">Download</a>

        <button class="btn share" onclick="shareImage('{{ img.image_url }}')">
            Share
        </button>

        
        

    </div>

</div>
{% endfor %}

</div>

<script>
function shareImage(url){
    navigator.clipboard.writeText(url);
    alert("Link copied!");
}
</script>

</body>
</html>
