<!DOCTYPE html>
<html>
<head>
<title>Generate AI Art</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    background: linear-gradient(135deg,#0f172a,#020617);
    color:white;
    font-family:Poppins;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:90%;
    max-width:500px;
    padding:25px;
    border-radius:20px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.1);
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    background:#111;
    color:white;
    outline:none;
}

button{
    width:100%;
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#ff7b00;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:#ff6a00;
}

/* LOADING */
.loading{
    display:none;
    text-align:center;
    margin-top:15px;
    color:#aaa;
}

.preview{
    margin-top:20px;
    text-align:center;
}

.preview img{
    width:100%;
    border-radius:10px;
    margin-top:10px;
}

/* DOWNLOAD */
.download-btn{
    background:#2ed573;
    margin-top:10px;
}

.download-btn:hover{
    background:#1fbf5a;
}

/* BACK */
.back{
    text-align:center;
    margin-top:15px;
}

a{
    color:#00d4ff;
    text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h2>⚡ Generate AI Art</h2>

<!-- FORM -->
<form method="POST" onsubmit="showLoading()">
    <input name="prompt" placeholder="Enter your AI prompt..." required>
    <button type="submit">🚀 Generate</button>
</form>

<!-- LOADING -->
<div class="loading" id="loading">
    🎨 Generating your AI image...
</div>

<!-- ERROR -->
{% if error %}
<p style="color:red; text-align:center; margin-top:10px;">
    {{ error }}
</p>
{% endif %}

<!-- IMAGE PREVIEW -->
{% if image_url %}
<div class="preview">
    <h3>✨ Generated Result</h3>

    <img src="{{ image_url }}">

    <a href="{{ image_url }}" download>
        <button class="download-btn">⬇ Download Image</button>
    </a>

    <p style="margin-top:10px;opacity:0.7;">
        ✅ Automatically saved to gallery
    </p>
</div>
{% endif %}

<div class="back">
    <a href="/gallery">⬅ Back to Gallery</a>
</div>

</div>

<script>
function showLoading(){
    document.getElementById("loading").style.display = "block";
}
</script>

</body>
</html>
