<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    background: radial-gradient(circle at top, #0f172a, #020617);
    color:white;
    padding:20px;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#38bdf8;
}

/* TOP BAR */
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.logout{
    background:linear-gradient(135deg,#ef4444,#b91c1c);
    color:white;
    padding:10px 15px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-bottom:30px;
}

.stat-card{
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(10px);
    padding:20px;
    border-radius:15px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.stat-card span{
    font-size:32px;
    color:#38bdf8;
    font-weight:bold;
}

/* CHART */
.chart-container{
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(12px);
    border-radius:20px;
    padding:20px;
    margin-bottom:30px;
}

canvas{
    height:350px !important;
}

/* SECTION TITLE */
h2{
    margin-top:30px;
    color:#38bdf8;
    border-left:4px solid #38bdf8;
    padding-left:10px;
}

/* USERS */
.user-box{
    background:#1e293b;
    padding:12px;
    margin:10px 0;
    border-radius:10px;
    display:flex;
    justify-content:space-between;
}

.delete-btn{
    background:#ef4444;
    color:white;
    padding:5px 10px;
    border-radius:6px;
    text-decoration:none;
}

/* IMAGES */
.image-box{
    display:inline-block;
    margin:10px;
    background:#1e293b;
    padding:10px;
    border-radius:10px;
}

.image-box img{
    border-radius:8px;
}
</style>

</head>

<body>

<div class="top-bar">
    <h1>🔥 Admin Dashboard</h1>
    <a href="/logout" class="logout">Logout</a>
</div>

<!-- STATS -->
<div class="stats">
    <div class="stat-card">
        <h3>Users</h3>
        <span>{{ stats.total_users }}</span>
    </div>

    <div class="stat-card">
        <h3>Images</h3>
        <span>{{ stats.total_images }}</span>
    </div>
</div>

<!-- CHART DATA -->
<script id="chart-data" type="application/json">
{
    "labels": {{ chart_labels | default([]) | tojson }},
    "data": {{ chart_data | default([]) | tojson }}
}
</script>

<!-- CHART -->
<div class="chart-container">
    <canvas id="chart"></canvas>
</div>

<script>
const raw = JSON.parse(document.getElementById("chart-data").textContent);

const ctx = document.getElementById("chart").getContext("2d");

let gradient = ctx.createLinearGradient(0, 0, 0, 400);
gradient.addColorStop(0, "#38bdf8");
gradient.addColorStop(1, "#6366f1");

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: raw.labels,
        datasets: [{
            label: "Stats Overview",
            data: raw.data,
            backgroundColor: gradient,
            borderRadius: 10
        }]
    },
    options: {
        responsive: true,
        plugins: {
            legend: { labels: { color: "white" } }
        },
        scales: {
            x: { ticks: { color: "#cbd5e1" }, grid: { display:false } },
            y: { ticks: { color: "#cbd5e1" }, grid: { color:"rgba(255,255,255,0.05)" } }
        }
    }
});
</script>

<!-- USERS -->
<h2>👤 Users</h2>

{% for u in users %}
    {% if u.is_admin != 1 %}
    <div class="user-box">
        <span>{{ u.username }} | {{ u.email }}</span>
        <a class="delete-btn" href="/admin/delete_user/{{ u.id }}">Delete</a>
    </div>
    {% endif %}
{% endfor %}

<!-- IMAGES -->
<h2>🖼 Images</h2>

{% for img in images %}
    <div class="image-box">
        <img src="{{ img.image_url }}" width="120"><br>
        <a class="delete-btn" href="/admin/delete_image/{{ img.id }}">Delete</a>
    </div>
{% endfor %}

</body>
</html>
